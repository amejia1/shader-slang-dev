[package]
name = "shader-slang-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Locate an installed shader-slang toolchain, or build the vendored source with the `vendored` feature"
build = "build.rs"
readme = "README.md"

# By default this crate only locates an existing shader-slang installation at
# runtime: $SHADER_SLANG_HOME, then common per-OS/per-architecture locations.
# The optional `vendored` feature builds the source supplied by shader-slang-src
# and exclusively uses those artifacts instead of installed locations.

[features]
default = []
vendored = ["dep:shader-slang-src"]

[dependencies]
shader-slang-src = { path = "../shader-slang-src", version = "=1.0.0", optional = true }

[[bin]]
name = "shader-slang-dev-installer"
path = "src/bin/shader-slang-dev-installer.rs"
required-features = ["vendored"]
