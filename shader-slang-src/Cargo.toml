[package]
name = "shader-slang-src"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Build the shader-slang compiler toolchain (slangc and friends) from source"
build = "build.rs"
readme = "README.md"

# This crate does not vendor the shader-slang source (a git submodule would
# make the crate too large to publish). By default — SHADER_SLANG_SOURCE_URL
# and SHADER_SLANG_DIST_URL both unset or empty — build.rs clones the
# shader-slang repository at tag v2026.21 with --recurse-submodules into
# $OUT_DIR and builds from the clone with CMake through the `cmake` crate.
# When SHADER_SLANG_SOURCE_URL is set to a non-empty https or file URL,
# build.rs instead fetches that source tarball with `ureq` (or copies it for
# file URLs) into $OUT_DIR and extracts it with `tar` and `flate2`; the
# tarball must already contain the external/ submodule checkouts. When
# SHADER_SLANG_DIST_URL is set to a non-empty https or file URL, build.rs
# fetches that prebuilt distribution tarball and uses the extracted
# directory as the installed toolchain, skipping the source build.

[build-dependencies]
cmake = "0.1"
flate2 = "1"
tar = "0.4"
ureq = "3"
url = "2"

[dependencies]
