# This crate vendors the shader-slang source as a git submodule at `slang/`.
# When the submodule is unavailable (a crates.io tarball or a cargo git
# dependency), build.rs clones the pinned release tag instead. No
# build-dependencies are required: the build drives `git` and `cmake` directly.

