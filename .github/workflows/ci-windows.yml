name: CI (Windows)

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: windows-latest
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-windows-x86_64.tar.gz
          - arch: aarch64
            runs-on: windows-11-arm
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-windows-aarch64.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build and run tests
        run: cargo test --workspace
      - name: Build and run tests (prebuilt binaries)
        run: |
          $env:SHADER_SLANG_DIST_URL = "${{ matrix.dist-url }}"
          cargo test --workspace
