name: CI (Windows)

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: windows-latest
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-windows-x86_64.tar.gz
          - arch: aarch64
            runs-on: windows-11-arm
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-windows-aarch64.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Download the shader-slang release tarball
        run: curl.exe -fL --retry 3 -o slang.tar.gz "${{ matrix.dist-url }}"
      - name: Extract the release tarball
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\slang-home" | Out-Null
          tar -xzf slang.tar.gz -C "$env:RUNNER_TEMP\slang-home"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (default features — detection only)
        run: cargo clippy -p shader-slang-dev --all-targets -- -D warnings
      - name: Test with SHADER_SLANG_HOME
        run: |
          $env:SHADER_SLANG_HOME = "$env:RUNNER_TEMP\slang-home"
          cargo test -p shader-slang-dev
      - name: Test detection of a common install location
        run: |
          New-Item -ItemType Directory -Force -Path "C:\slang-windows-${{ matrix.arch }}" | Out-Null
          tar -xzf slang.tar.gz -C "C:\slang-windows-${{ matrix.arch }}"
          cargo test -p shader-slang-dev

  vendored:
    name: vendored (x86_64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test the vendored workspace
        run: cargo test --workspace --features vendored
      - name: Clippy with vendored artifacts
        run: cargo clippy --workspace --all-targets --features vendored -- -D warnings
      - name: Test the shader-slang-dev-installer binary
        run: |
          cargo run --features vendored --bin shader-slang-dev-installer -- "$env:RUNNER_TEMP\slang-installed"
          $env:SHADER_SLANG_HOME = "$env:RUNNER_TEMP\slang-installed"
          cargo test -p shader-slang-dev
