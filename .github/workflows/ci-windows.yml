name: CI (Windows)

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: windows-latest
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-windows-x86_64.tar.gz
          - arch: aarch64
            runs-on: windows-11-arm
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-windows-aarch64.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Download the shader-slang release tarball
        run: curl.exe -fL --retry 3 -o slang.tar.gz "${{ matrix.dist-url }}"
      - name: Extract the release tarball
        # The release tarballs have no top-level directory (bin/, lib/, ...
        # at the archive root), so no --strip-components.
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\slang-home" | Out-Null
          tar -xzf slang.tar.gz -C "$env:RUNNER_TEMP\slang-home"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (default features — detection only)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test with SHADER_SLANG_HOME
        run: |
          $env:SHADER_SLANG_HOME = "$env:RUNNER_TEMP\slang-home"
          cargo test --workspace
      - name: Test the build feature (distribution tarball into $OUT_DIR)
        env:
          SHADER_SLANG_DIST_URL: ${{ matrix.dist-url }}
        run: cargo test --workspace --features build
      - name: Clippy with the build feature
        run: |
          $env:SHADER_SLANG_HOME = "$env:RUNNER_TEMP\slang-home"
          cargo clippy --workspace --all-targets --features build -- -D warnings
      - name: Test the shader-slang-dev-installer binary
        run: |
          $env:SHADER_SLANG_HOME = "$env:RUNNER_TEMP\slang-home"
          cargo run --features build --bin shader-slang-dev-installer -- "$env:RUNNER_TEMP\slang-installed"
          $env:SHADER_SLANG_HOME = "$env:RUNNER_TEMP\slang-installed"
          cargo test --workspace
      - name: Test detection of a common install location
        run: |
          New-Item -ItemType Directory -Force -Path "C:\slang-windows-${{ matrix.arch }}" | Out-Null
          tar -xzf slang.tar.gz -C "C:\slang-windows-${{ matrix.arch }}"
          cargo test --workspace

  # Building shader-slang from source takes a long time (> 30 min), so these
  # steps run in a separate job after all the fast tests above. Each source
  # build uses its own target directory so the second one really re-clones.
  source-build:
    name: source-build (x86_64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Create a shader-slang source tarball (with submodule checkouts)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\slang-pkg" | Out-Null
          git clone --depth 1 --branch v2026.21 --recurse-submodules --shallow-submodules -c core.longpaths=true `
            https://github.com/shader-slang/slang.git "$env:RUNNER_TEMP\slang-pkg\slang"
          Get-ChildItem -Path "$env:RUNNER_TEMP\slang-pkg\slang" -Recurse -Force -Filter .git |
            ForEach-Object { Remove-Item $_.FullName -Recurse -Force }
          tar -czf "$env:RUNNER_TEMP\slang-source.tar.gz" -C "$env:RUNNER_TEMP\slang-pkg" slang
          Get-Item "$env:RUNNER_TEMP\slang-source.tar.gz"
      - name: Test building from the source tarball (SHADER_SLANG_SOURCE_URL)
        run: |
          $tarball = "$env:RUNNER_TEMP\slang-source.tar.gz"
          $env:SHADER_SLANG_SOURCE_URL = "file:///" + ($tarball -replace '\\', '/')
          cargo test --workspace --features build
      - name: Test building from a git clone (no environment variables set)
        run: |
          Remove-Item Env:SHADER_SLANG_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:SHADER_SLANG_DIST_URL -ErrorAction SilentlyContinue
          Remove-Item Env:SHADER_SLANG_SOURCE_URL -ErrorAction SilentlyContinue
          $env:CARGO_TARGET_DIR = "$env:GITHUB_WORKSPACE\target-clone"
          cargo test --workspace --features build
