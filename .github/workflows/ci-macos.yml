name: CI (macOS)

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: macos-15-intel
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-macos-x86_64.tar.gz
          - arch: aarch64
            runs-on: macos-latest
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-macos-aarch64.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Download the shader-slang release tarball
        run: curl -fL --retry 3 -o slang.tar.gz "${{ matrix.dist-url }}"
      - name: Extract the release tarball
        run: |
          mkdir -p "$RUNNER_TEMP/slang-home"
          tar -xzf slang.tar.gz -C "$RUNNER_TEMP/slang-home"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (default features — detection only)
        run: cargo clippy -p shader-slang-dev --all-targets -- -D warnings
      - name: Test with SHADER_SLANG_HOME
        run: SHADER_SLANG_HOME="$RUNNER_TEMP/slang-home" cargo test -p shader-slang-dev
      - name: Test detection of a common install location
        run: |
          sudo mkdir -p "/opt/slang-macos-${{ matrix.arch }}"
          sudo tar -xzf slang.tar.gz -C "/opt/slang-macos-${{ matrix.arch }}"
          cargo test -p shader-slang-dev

  vendored:
    name: vendored (aarch64)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test the vendored workspace
        run: cargo test --workspace --features vendored
      - name: Clippy with vendored artifacts
        run: cargo clippy --workspace --all-targets --features vendored -- -D warnings
      - name: Test the shader-slang-dev-installer binary
        run: |
          cargo run --features vendored --bin shader-slang-dev-installer -- "$RUNNER_TEMP/slang-installed"
          SHADER_SLANG_HOME="$RUNNER_TEMP/slang-installed" cargo test -p shader-slang-dev
