name: CI (Linux)

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-linux-x86_64.tar.gz
          - arch: aarch64
            runs-on: ubuntu-26.04-arm
            dist-url: https://github.com/shader-slang/slang/releases/download/v2026.21/slang-2026.21-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Download the shader-slang release tarball
        run: curl -fL --retry 3 -o slang.tar.gz "${{ matrix.dist-url }}"
      - name: Extract the release tarball
        run: |
          mkdir -p "$RUNNER_TEMP/slang-home"
          tar -xzf slang.tar.gz -C "$RUNNER_TEMP/slang-home" --strip-components=1
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (default features — detection only)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test with SHADER_SLANG_HOME
        env:
          SHADER_SLANG_HOME: ${{ env.RUNNER_TEMP }}/slang-home
        run: cargo test --workspace
      - name: Test the build feature (distribution tarball into $OUT_DIR)
        env:
          SHADER_SLANG_DIST_URL: ${{ matrix.dist-url }}
        run: cargo test --workspace --features build
      - name: Clippy with the build feature
        env:
          SHADER_SLANG_HOME: ${{ env.RUNNER_TEMP }}/slang-home
        run: cargo clippy --workspace --all-targets --features build -- -D warnings
      - name: Test the shader-slang-dev-installer binary
        env:
          SHADER_SLANG_HOME: ${{ env.RUNNER_TEMP }}/slang-home
        run: |
          cargo run --features build --bin shader-slang-dev-installer -- "$RUNNER_TEMP/slang-installed"
          SHADER_SLANG_HOME="$RUNNER_TEMP/slang-installed" cargo test --workspace
      - name: Test detection of a common install location
        run: |
          sudo mkdir -p "/opt/slang-linux-${{ matrix.arch }}"
          sudo tar -xzf slang.tar.gz -C "/opt/slang-linux-${{ matrix.arch }}" --strip-components=1
          cargo test --workspace
